<app-header />
<app-main-container>
  <section>
    <h2>Profil utilisateur</h2>
    <form [formGroup]="profileForm" (ngSubmit)="updateUser()">
      <mat-form-field>
        <mat-label>Nom d'utilisateur</mat-label>
        <input matInput formControlName="username" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Adresse email</mat-label>
        <input matInput formControlName="email" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <button
        matButton="filled"
        color="primary"
      >Sauvegarder</button>
    </form>
  </section>

  <section>
    <h2>Abonnements</h2>
    @for(theme of themes(); track theme.id) {
      <mat-card>
        <mat-card-title>{{theme.name}}</mat-card-title>
        <mat-card-content>
          {{theme.description}}
        </mat-card-content>
        <mat-card-actions>
          <button matButton (click)="unsubscribeTheme(theme.id)">
            Se désabonner
          </button>
        </mat-card-actions>
      </mat-card>
    }
  </section>
</app-main-container>
